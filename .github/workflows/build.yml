name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Instalar Gradle 2.14.1 (exigido pelo ForgeGradle 2.1)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: gradle setupCiWorkspace build --no-daemon

      - name: Publicar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: souplegit-jar
          path: build/libs/*.jar
